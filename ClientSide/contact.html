<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickBite - Contact Us</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">Quick<span>Bite</span></div>
  <nav>
    <ul>
      <li><a href="home.html">Home</a></li>
      <li><a href="menu.html">Menu</a></li>
      <li><a href="cart.html" id="cartLink">Cart</a></li>
      <li><a href="track-order.html">Track Order</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
      <li><a href="login-register.html" id="authLink">Login</a></li>
    </ul>
  </nav>
</header>

<section class="section">
  <h2>Contact Us</h2>
  <p class="sub">We usually reply within a few hours</p>

  <div class="two-col">
    <form class="form-box" id="contactForm" novalidate>
      <div class="form-group">
        <label for="contactName">Name</label>
        <input type="text" id="contactName" placeholder="Your name">
        <span class="error" id="contactNameError"></span>
      </div>
      <div class="form-group">
        <label for="contactEmail">Email</label>
        <input type="email" id="contactEmail" placeholder="you@example.com">
        <span class="error" id="contactEmailError"></span>
      </div>
      <div class="form-group">
        <label for="contactMessage">Message</label>
        <textarea id="contactMessage" rows="5" placeholder="How can we help?"></textarea>
        <span class="error" id="contactMessageError"></span>
      </div>
      <button type="submit" class="btn">Send Message</button>
    </form>

    <div>
      <h3>Restaurant Address</h3>
      <p style="margin:10px 0; color:#8A7A6B;">123 Food Street, Rajkot, Gujarat</p>
      <h3>Phone</h3>
      <p style="margin:10px 0; color:#8A7A6B;">+91 XXXXXXXXXX</p>
      <h3>Email</h3>
      <p style="margin:10px 0; color:#8A7A6B;">hello@quickbite.com</p>
    </div>
  </div>
</section>

<footer>
  QuickBite &mdash; Your cravings, one click away &middot; &copy; 2026
</footer>

<script src="../data.js"></script>
<script src="script.js"></script>
</body>
</html>
