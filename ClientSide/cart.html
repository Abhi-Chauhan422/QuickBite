<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickBite - Cart</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">Quick<span>Bite</span></div>
  <nav>
    <ul>
      <li><a href="home.html">Home</a></li>
      <li><a href="menu.html">Menu</a></li>
      <li><a href="cart.html" id="cartLink" class="active">Cart</a></li>
      <li><a href="track-order.html">Track Order</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="login-register.html" id="authLink">Login</a></li>
    </ul>
  </nav>
</header>

<section class="section">
  <h2>Your Cart</h2>
  <p class="sub">Review your order before checkout</p>

  <div id="cartBox"></div>

  <div id="checkoutRow">
    <div class="cart-summary" id="summaryBox"></div>

    <h2 style="margin-top:40px;">Delivery Details</h2>
    <form class="form-box" id="checkoutForm" novalidate>
      <div class="form-group">
        <label for="address">Delivery Address</label>
        <input type="text" id="address" placeholder="Enter your full address">
        <span class="error" id="addressError"></span>
      </div>
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="10-digit mobile number">
        <span class="error" id="phoneError"></span>
      </div>
      <div class="form-group">
        <label for="payment">Payment Method</label>
        <select id="payment">
          <option>Cash on Delivery</option>
          <option>UPI</option>
          <option>Card</option>
        </select>
      </div>
      <button type="submit" class="btn" id="placeOrderBtn">Place Order</button>
    </form>
  </div>
</section>

<footer>
  QuickBite &mdash; Your cravings, one click away &middot; &copy; 2026
</footer>

<script src="../data.js"></script>
<script src="script.js"></script>
</body>
</html>
