<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickBite Admin - Manage Menu</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">Quick<span>Bite</span> Admin</div>
</header>

<div class="admin-wrap">
  <div class="sidebar">
    <a href="dashboard.html">Dashboard</a>
    <a href="manage-menu.html" class="active">Manage Menu</a>
    <a href="manage-orders.html">Manage Orders</a>
    <a href="manage-customers.html">Manage Customers</a>
    <a href="reports.html">Reports</a>
    <a href="#" onclick="adminLogout(); return false;">Logout</a>
  </div>

  <div class="main-content">
    <h2>Manage Menu</h2>

    <h3 id="formTitle" style="margin-bottom:12px;">Add New Item</h3>
    <form class="form-box" id="itemForm" novalidate>
      <input type="hidden" id="itemId">
      <div class="form-group">
        <label for="itemName">Item Name</label>
        <input type="text" id="itemName" placeholder="e.g. Veg Burger">
        <span class="error" id="itemNameError"></span>
      </div>
      <div class="form-group">
        <label for="itemCategory">Category</label>
        <select id="itemCategory">
          <option>Starters</option>
          <option>Main Course</option>
          <option>Desserts</option>
          <option>Beverages</option>
        </select>
      </div>
      <div class="form-group">
        <label for="itemPrice">Price (Rs.)</label>
        <input type="number" id="itemPrice" placeholder="e.g. 180">
        <span class="error" id="itemPriceError"></span>
      </div>
      <div>
        <button type="submit" class="btn" id="saveItemBtn">Save Item</button>
        <button type="button" class="btn btn-grey" id="cancelEditBtn" style="display:none;">Cancel</button>
      </div>
    </form>

    <h3 style="margin-bottom:12px;">Existing Items</h3>
    <table id="menuTable"></table>
  </div>
</div>

<script src="../data.js"></script>
<script src="admin.js"></script>
</body>
</html>
