<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickBite Admin - Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">Quick<span>Bite</span> Admin</div>
</header>

<div class="admin-wrap">
  <div class="sidebar">
    <a href="dashboard.html" class="active">Dashboard</a>
    <a href="manage-menu.html">Manage Menu</a>
    <a href="manage-orders.html">Manage Orders</a>
    <a href="manage-customers.html">Manage Customers</a>
    <a href="reports.html">Reports</a>
    <a href="#" onclick="adminLogout(); return false;">Logout</a>
  </div>

  <div class="main-content">
    <h2>Dashboard</h2>

    <div class="stat-cards">
      <div class="stat-card"><div class="num" id="statOrders">0</div><div class="label">Total Orders</div></div>
      <div class="stat-card"><div class="num" id="statRevenue">Rs.0</div><div class="label">Total Revenue</div></div>
      <div class="stat-card"><div class="num" id="statCustomers">0</div><div class="label">Customers</div></div>
      <div class="stat-card"><div class="num" id="statItems">0</div><div class="label">Menu Items</div></div>
    </div>

    <h3 style="margin-bottom:12px;">Recent Orders</h3>
    <table id="dashRecentOrders"></table>
  </div>
</div>

<script src="../data.js"></script>
<script src="admin.js"></script>
</body>
</html>
